<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Аркада Ronaldo FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden]{display:none!important}
:root{
  color-scheme:dark;
  --deep:#05202a;
  --panel:#0b2f3b;
  --line:rgba(255,244,222,.14);
  --ink:#fff4de;
  --muted:#a9cdca;
  --sun:#ffb347;
  --flame:#ff5a36;
  --flame-dark:#a8321f;
  --veil:rgba(4,26,33,.72);
  --display:"Russo One","Arial Black",Impact,sans-serif;
  --body:"Rubik",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);overflow:hidden;
  font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.screen{position:absolute;inset:0}

/* ---------- home ---------- */
#home{overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:radial-gradient(120% 60% at 15% 0%,#143f4b 0%,var(--deep) 65%)}
.home-wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font-weight:700;font-size:11px;letter-spacing:.24em;color:var(--sun);text-transform:uppercase}
.home-head{display:flex;flex-direction:column;gap:8px}
.home-head h1{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(56px,17vw,92px);line-height:.9;
  color:var(--ink);text-shadow:0 4px 0 var(--flame-dark),0 14px 34px rgba(0,0,0,.45)}
.home-head p{margin:0;color:var(--muted);font-size:15px;line-height:1.45;max-width:38ch}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;text-decoration:none;color:var(--ink);cursor:pointer;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;
  transition:transform .15s ease,border-color .15s ease}
.card:hover{border-color:var(--acc)}
.card:active{transform:scale(.98)}
.card canvas{display:block;width:100%;aspect-ratio:16/10;max-width:100%;background:#000}
.card.feature{grid-column:1/-1}
.card.feature canvas{aspect-ratio:16/7}
.card-body{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px;border-top:3px solid var(--acc)}
.card h2{margin:0;font-family:var(--display);font-weight:400;font-size:19px;letter-spacing:.02em}
.card p{margin:0;font-size:12.5px;line-height:1.4;color:var(--muted)}
.card .best{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);margin-top:2px}
.tag{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;letter-spacing:.14em;padding:4px 7px;border-radius:6px;
  background:rgba(5,32,42,.8);color:var(--ink)}
.home-foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.home-foot p{margin:0;font-size:12px;color:var(--muted);line-height:1.5;max-width:40ch}

.btn{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:var(--ink);background:var(--flame);
  border:0;border-radius:12px;padding:14px 30px;cursor:pointer;box-shadow:0 5px 0 var(--flame-dark),0 12px 24px rgba(0,0,0,.35)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--flame-dark)}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid rgba(255,244,222,.35);font-size:15px;padding:10px 20px}
.btn.small{font-size:16px;padding:11px 18px}

/* ---------- play ---------- */
#play{display:flex;flex-direction:column;background:#031419}
.bar{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;height:52px;padding-inline:10px;
  background:var(--deep);border-bottom:2px solid var(--acc,var(--sun))}
.bar-btn{height:38px;min-width:38px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.04);
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding-inline:10px;font-weight:700;font-size:14px}
.bar-btn i{display:block;width:4px;height:14px;background:var(--ink);border-radius:2px}
.bar-mid{display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:0}
#barTitle{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--acc,var(--sun))}
#barHud{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#pauseBtn.off{visibility:hidden}
#area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{position:relative;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#actBtn{position:absolute;right:16px;bottom:18px;width:84px;height:84px;border-radius:50%;cursor:pointer;
  font-family:var(--display);font-size:17px;letter-spacing:.04em;border:3px solid rgba(255,244,222,.8);
  background:rgba(224,67,58,.72);box-shadow:0 6px 18px rgba(0,0,0,.4);touch-action:none}
#actBtn:active{transform:scale(.93)}

.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding-inline:22px;text-align:center;background:var(--veil);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:5}
.ov-title{font-family:var(--display);font-weight:400;margin:0;font-size:clamp(30px,9vw,44px);line-height:1;
  text-shadow:0 3px 0 rgba(0,0,0,.35);text-wrap:balance}
.ov-big{font-family:var(--display);font-size:clamp(46px,15vw,70px);line-height:1;color:var(--acc,var(--sun));font-variant-numeric:tabular-nums}
.ov-sub{margin:0;max-width:32ch;color:var(--muted);font-size:14.5px;line-height:1.45;text-wrap:balance}
.ov-rec{font-weight:700;font-size:12px;letter-spacing:.2em;color:#1b1206;background:var(--sun);padding:5px 10px;border-radius:6px}
.ov-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:340px}
.ov-btns .btn:not(.ghost){background:var(--acc,var(--flame));color:#0d1a14;box-shadow:0 5px 0 rgba(0,0,0,.4),0 12px 24px rgba(0,0,0,.35)}
.ov-btns .btn.wide{flex-basis:100%}
</style>
</head>
<body>

<section id="home" class="screen">
  <div class="home-wrap">
    <header class="home-head">
      <div class="eyebrow">Ronaldo FC · игровой зал</div>
      <h1>АРКАДА</h1>
      <p>Пять игр для телефона: футбол, пинг-понг, змейка, кирпичи и воздушный бой. Нажми на карточку и играй.</p>
    </header>
    <div id="cards" class="cards"></div>
    <div class="home-foot">
      <p>На компьютере работают мышь и клавиатура: стрелки или WASD, пробел — действие, P — пауза.</p>
      <button id="soundBtn" class="btn ghost">Звук: вкл</button>
    </div>
  </div>
</section>

<section id="play" class="screen" hidden>
  <header class="bar">
    <button id="backBtn" class="bar-btn" aria-label="К списку игр">‹ Игры</button>
    <div class="bar-mid"><span id="barTitle"></span><span id="barHud"></span></div>
    <button id="pauseBtn" class="bar-btn off" aria-label="Пауза"><i></i><i></i></button>
  </header>
  <div id="area">
    <div id="stage">
      <canvas id="cv"></canvas>
      <button id="actBtn" hidden>УДАР</button>
      <div id="ov" class="overlay" hidden></div>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const norm = (x, y) => { const l = Math.hypot(x, y); return l ? { x: x / l, y: y / l } : { x: 0, y: 0 }; };
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 400;
const PLANE_URL = (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname))
  ? '../plane/index.html' : 'https://claude.ai/artifact/NoG7CGKDLNHy8PFYfgr3b6';

function rrect(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r, col) { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); }

/* ================= audio ================= */
let AC = null, master = null, noiseBuf = null, muted = false;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : .5; master.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f, dur, type, vol, slide) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + dur);
  g.gain.setValueAtTime(vol || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, freq, type) {
  if (!AC || muted) return;
  const t = AC.currentTime, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 1000, t);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(.05, dur / 3)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const seq = (notes, gap, type, vol) => notes.forEach((f, i) => setTimeout(() => tone(f, gap * 1.4 / 1000, type || 'square', vol || .06), i * gap));
const sfx = {
  pong() { tone(740, .06, 'square', .07, -120); },
  wall() { tone(420, .04, 'triangle', .05); },
  point() { tone(330, .25, 'sawtooth', .07, -180); },
  win() { seq([523, 659, 784, 1046, 1318], 110); },
  lose() { seq([392, 330, 262, 196], 150, 'triangle', .08); },
  kick(k) { noise(.12, .35 * (k || 1), 900); tone(140, .1, 'sine', .2 * (k || 1), -60); },
  whistle() { tone(2300, .5, 'square', .03, 60); },
  goal() { noise(1.8, .35, 1400, 'bandpass'); seq([523, 659, 784, 1046], 120); },
  eat() { tone(600, .07, 'square', .06, 300); },
  gold() { seq([880, 1175, 1568], 70); },
  die() { noise(.5, .35, 900); tone(300, .5, 'sawtooth', .09, -250); },
  brick(i) { tone(500 + (i || 0) * 60, .05, 'square', .05); },
  paddle() { tone(300, .06, 'triangle', .07); },
  power() { seq([660, 880, 1100], 60); },
  tick() { tone(1000, .03, 'square', .04); },
};
function setMuted(m) {
  muted = m;
  if (master) master.gain.setTargetAtTime(m ? 0 : .5, AC.currentTime, .05);
  $('soundBtn').textContent = 'Звук: ' + (m ? 'выкл' : 'вкл');
}

/* ================= storage ================= */
function getBest(id) { try { return +localStorage.getItem('arcade-best-' + id) || 0; } catch (e) { return 0; } }
function setBest(id, v) { try { localStorage.setItem('arcade-best-' + id, String(v)); } catch (e) {} }

/* ================= shell ================= */
const stage = $('stage'), cv = $('cv'), ctx = cv.getContext('2d');
let H = 700, S = 1, DPR = 1, cur = null, paused = false;
let parts = [], floats = [];
const keys = {};

const api = {
  get H() { return H; },
  keys,
  hud(t) { if ($('barHud').textContent !== t) $('barHud').textContent = t; },
  overlay(o) {
    const ov = $('ov'); ov.innerHTML = '';
    const add = (tag, cls, txt) => { const e = document.createElement(tag); e.className = cls; e.textContent = txt; ov.appendChild(e); return e; };
    if (o.eyebrow) add('div', 'eyebrow', o.eyebrow);
    if (o.title) add('h2', 'ov-title', o.title);
    if (o.big != null) add('div', 'ov-big', o.big);
    if (o.record) add('div', 'ov-rec', 'НОВЫЙ РЕКОРД');
    if (o.sub) add('p', 'ov-sub', o.sub);
    if (o.buttons) {
      const box = add('div', 'ov-btns', '');
      for (const b of o.buttons) {
        const e = document.createElement('button');
        e.className = 'btn' + (b.ghost ? ' ghost' : '') + (b.small ? ' small' : '') + (b.wide ? ' wide' : '');
        e.textContent = b.label; e.onclick = () => { audioInit(); b.fn(); }; box.appendChild(e);
      }
    }
    ov.hidden = false;
    const first = ov.querySelector('button'); if (first) first.focus({ preventScroll: true });
  },
  hideOverlay() { $('ov').hidden = true; },
  action(label) { const b = $('actBtn'); if (label) { b.textContent = label; b.hidden = false; } else b.hidden = true; },
  burst(x, y, cols, n, spd, size, life, grav) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(.3, 1) * (spd || 150);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(.5, 1) * (life || .6), max: life || .6, size: rand(.6, 1.2) * (size || 3), col: cols[(Math.random() * cols.length) | 0], grav: grav || 0 });
    }
  },
  float(x, y, text, col, size) { floats.push({ x, y, text, col: col || '#fff4de', size: size || 16, life: 1 }); },
  getBest, setBest,
};

function resize() {
  const a = $('area'); const w = a.clientWidth, h = a.clientHeight;
  if (!w || !h) return;
  S = Math.min(w / W, h / 600);
  H = Math.round(h / S);
  stage.style.width = (W * S) + 'px'; stage.style.height = (H * S) + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * S * DPR); cv.height = Math.round(H * S * DPR);
}

function openGame(g) {
  audioInit();
  $('home').hidden = true; $('play').hidden = false;
  document.documentElement.style.setProperty('--acc', g.accent);
  $('barTitle').textContent = g.name; api.hud('');
  cur = g; paused = false; parts = []; floats = []; api.action(null);
  resize(); g.enter();
}
function goHome() {
  if (cur && cur.leave) cur.leave();
  cur = null; paused = false; api.action(null); api.hideOverlay();
  $('play').hidden = true; $('home').hidden = false;
  document.documentElement.style.removeProperty('--acc');
  renderCards();
}
const running = () => cur && (cur.state === 'play' || cur.state === 'goal');
function pause() {
  if (!running() || paused) return;
  paused = true;
  api.overlay({ eyebrow: cur.name, title: 'ПАУЗА', buttons: [
    { label: 'ДАЛЬШЕ', fn: resume, wide: true },
    { label: 'Заново', ghost: true, fn: () => { paused = false; api.hideOverlay(); cur.enter(); } },
    { label: 'К играм', ghost: true, fn: goHome },
  ] });
}
function resume() { paused = false; api.hideOverlay(); last = performance.now(); }

/* input */
function toWorld(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / S, y: (e.clientY - r.top) / S, id: e.pointerId, type: e.pointerType }; }
stage.addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  audioInit();
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  if (cur && !paused && cur.down) cur.down(toWorld(e));
});
stage.addEventListener('pointermove', e => { if (cur && !paused && cur.move) cur.move(toWorld(e)); });
const up = e => { if (cur && cur.up) cur.up(toWorld(e)); };
stage.addEventListener('pointerup', up);
stage.addEventListener('pointercancel', up);
$('actBtn').addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audioInit(); if (cur && !paused && cur.act) cur.act(); });
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code) && !$('play').hidden) e.preventDefault();
  if (!cur) return;
  if (e.code === 'KeyP' || e.code === 'Escape') { if (paused) resume(); else pause(); return; }
  if (!paused && cur.key) cur.key(e.code);
});
addEventListener('keyup', e => { keys[e.code] = false; });
$('backBtn').onclick = goHome;
$('pauseBtn').onclick = pause;
$('soundBtn').onclick = () => { audioInit(); setMuted(!muted); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
addEventListener('resize', () => { if (cur) resize(); });

/* loop */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (cur) {
    if (!paused) {
      cur.update(dt);
      for (const p of parts) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.grav * dt; p.vx *= .97; p.vy *= .97; }
      parts = parts.filter(p => p.life > 0);
      for (const f of floats) { f.life -= dt * .9; f.y -= 34 * dt; }
      floats = floats.filter(f => f.life > 0);
    }
    $('pauseBtn').classList.toggle('off', !running() || paused);
    ctx.setTransform(S * DPR, 0, 0, S * DPR, 0, 0);
    cur.render(ctx, now / 1000);
    for (const p of parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.col; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of floats) {
      ctx.globalAlpha = clamp(f.life * 1.6, 0, 1); ctx.font = f.size + 'px "Russo One", sans-serif';
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillText(f.text, f.x + 1, f.y + 2); ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

/* ================= PING-PONG ================= */
const PONG_AI = [{ name: 'Новичок', spd: 250, err: 30 }, { name: 'Любитель', spd: 400, err: 15 }, { name: 'Чемпион', spd: 640, err: 5 }];
const pong = {
  id: 'pong', name: 'Пинг-понг', accent: '#39c6e0',
  desc: 'Против компьютера или вдвоём на одном телефоне.',
  bestText: v => v ? 'Побед: ' + v : 'Побед пока нет',
  enter() {
    this.state = 'menu'; this.level = 1; this.setup(); api.hud('до 7 очков');
    api.overlay({ eyebrow: 'Пинг-понг · до 7 очков', title: 'ВЫБЕРИ СОПЕРНИКА',
      sub: 'Води пальцем по своей половине стола. Удар краем ракетки закручивает мяч.',
      buttons: [...PONG_AI.map((a, i) => ({ label: a.name, small: true, fn: () => this.start(i) })),
        { label: 'Вдвоём на одном экране', ghost: true, wide: true, fn: () => this.start(-1) }] });
  },
  setup() {
    this.pw = 78; this.ph = 12;
    this.bot = { x: W / 2, y: H - 48, vx: 0, tx: W / 2 }; this.top = { x: W / 2, y: 48, vx: 0, tx: W / 2 };
    this.ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, r: 7 }; this.trail = []; this.sc = [0, 0];
    this.serveT = 0; this.server = this.bot; this.ptr = {}; this.aiErr = 0; this.rally = 0; this.flash = 0;
  },
  start(level) { this.level = level; this.setup(); this.state = 'play'; api.hideOverlay(); this.serve(this.bot); this.hudUpd(); },
  serve(p) { this.server = p; this.serveT = 1.1; this.ball.vx = this.ball.vy = 0; this.trail = []; this.rally = 0; },
  hudUpd() { const two = this.level < 0; api.hud((two ? 'НИЗ ' : 'ТЫ ') + this.sc[0] + ' : ' + this.sc[1] + (two ? ' ВЕРХ' : ' ИИ')); },
  update(dt) {
    if (this.flash > 0) this.flash -= dt;
    if (this.state !== 'play') return;
    const K = api.keys, B = this.bot, T = this.top, b = this.ball, half = this.pw / 2, two = this.level < 0;
    B.y = H - 48;
    if (K.ArrowLeft || (!two && K.KeyA)) B.tx -= 560 * dt;
    if (K.ArrowRight || (!two && K.KeyD)) B.tx += 560 * dt;
    if (two) { if (K.KeyA) T.tx -= 560 * dt; if (K.KeyD) T.tx += 560 * dt; } else this.ai(dt);
    for (const P of [B, T]) {
      P.tx = clamp(P.tx, half, W - half);
      const ox = P.x, maxV = (P === T && !two) ? PONG_AI[this.level].spd : 3000;

const bricks = {

  start() { this.score = 0; this.lives = 3; this.lvl = 0; this.build(); this.resetBall(); this.state = 'play'; api.hideOverlay(); this.hudUpd(); },

  over() {
    this.state = 'over'; sfx.lose();
    const rec = this.score > getBest('bricks'); if (rec) setBest('bricks', this.score);
    api.overlay({ eyebrow: 'Мячи закончились · уровень ' + (this.lvl + 1), title: 'ИГРА ОКОНЧЕНА', big: String(this.score), record: rec && this.score > 0,
      sub: 'Рекорд: ' + getBest('bricks'), buttons: [{ label: 'ЕЩЁ РАЗ', fn: () => this.start() }, { label: 'К играм', ghost: true, fn: goHome }] });
  },
  render(c, t) {
    c.fillStyle = '#1a0f2e'; c.fillRect(0, 0, W, H);
    c.strokeStyle = 'rgba(255,127,160,.06)'; c.lineWidth = 1; c.beginPath();
    for (let x = 0; x <= W; x += 25) { c.moveTo(x, 0); c.lineTo(x, H); } for (let y = 0; y <= H; y += 25) { c.moveTo(0, y); c.lineTo(W, y); } c.stroke();
    for (const k of this.bricks) {
      if (k.dead) continue;
      c.fillStyle = k.col; rrect(c, k.x, k.y, k.w, k.h, 4); c.fill();
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(k.x + 3, k.y + 2, k.w - 6, 3);
      c.fillStyle = 'rgba(0,0,0,.18)'; c.fillRect(k.x + 3, k.y + k.h - 4, k.w - 6, 2);
      if (k.silver && k.hp === 1) { c.strokeStyle = 'rgba(40,40,60,.7)'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(k.x + k.w * .3, k.y + 2); c.lineTo(k.x + k.w * .45, k.y + k.h * .6); c.lineTo(k.x + k.w * .62, k.y + k.h - 2); c.stroke(); }
    }
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const p of this.pows) {
      const [col, ch] = BR_POW[p.type];
      c.fillStyle = col; rrect(c, p.x - 16, p.y - 9, 32, 18, 9); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.8)'; c.lineWidth = 1.5; c.stroke();
      c.fillStyle = '#1a0f2e'; c.font = '12px "Russo One", sans-serif'; c.fillText(ch, p.x, p.y + 1);
    }
    const P = this.pad, py = H - 50;
    const g = c.createLinearGradient(0, py - 6, 0, py + 6); g.addColorStop(0, '#ffc2d2'); g.addColorStop(1, '#e0527a');
    c.shadowColor = '#ff7fa0'; c.shadowBlur = 14; c.fillStyle = g; rrect(c, P.x - P.w / 2, py - P.h / 2, P.w, P.h, 6); c.fill(); c.shadowBlur = 0;
    for (const b of this.balls) { circle(c, b.x, b.y, b.r + 4, 'rgba(255,255,255,.12)'); circle(c, b.x, b.y, b.r, '#fff4de'); }
    if (this.state === 'play' && this.balls.some(b => b.stuck)) {
      c.font = '700 13px Rubik, sans-serif'; c.fillStyle = 'rgba(255,244,222,' + (.55 + .35 * Math.sin(t * 4)) + ')';
      c.fillText('Отпусти палец, чтобы запустить мяч', W / 2, H - 100);
    }
  },
  icon(c, w, h) {
    c.fillStyle = '#1a0f2e'; c.fillRect(0, 0, w, h);
    const cols = ['#ff5a36', '#ffb347', '#ffd34d', '#5fd35f', '#39c6e0'], bw = (w - 12) / 7;
    cols.forEach((col, r) => { for (let i = 0; i < 7; i++) { if ((r === 3 && i === 2) || (r === 4 && (i === 2 || i === 3))) continue; c.fillStyle = col; rrect(c, 6 + i * bw + 1, 8 + r * 11, bw - 2, 8, 2); c.fill(); } });
    c.fillStyle = '#ff7fa0'; rrect(c, w * .42, h - 16, 44, 7, 3); c.fill();
    circle(c, w * .4, h * .66, 4.5, '#fff4de');
  },
};

/* ================= hub ================= */
const GAMES = [football, pong, snake, bricks];
function planeIcon(c, w, h) {
  const g = c.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#0c3b49'); g.addColorStop(1, '#136571'); c.fillStyle = g; c.fillRect(0, 0, w, h);
  c.strokeStyle = 'rgba(210,245,240,.15)'; c.lineWidth = 2; for (let i = 0; i < 14; i++) { const x = (i * 53) % w, y = (i * 37) % h; c.beginPath(); c.moveTo(x, y); c.lineTo(x + 12, y); c.stroke(); }
  c.save(); c.translate(w * .5, h * .58);
  c.fillStyle = '#efe0bd'; c.fillRect(-26, -2, 52, 11); c.fillStyle = '#d6452f'; c.fillRect(-26, -2, 8, 11); c.fillRect(18, -2, 8, 11);
  c.fillStyle = '#efe0bd'; c.fillRect(-11, 18, 22, 6);
  c.fillStyle = '#d6452f'; c.beginPath(); c.ellipse(0, 1, 6, 22, 0, 0, TAU); c.fill();
  c.fillStyle = '#1d3550'; c.beginPath(); c.ellipse(0, -4, 3.2, 5.5, 0, 0, TAU); c.fill();
  c.restore();
  c.fillStyle = '#6f7d49'; for (const [x, y] of [[w * .25, h * .2], [w * .75, h * .24]]) { c.fillRect(x - 16, y - 3, 32, 8); c.fillRect(x - 4, y - 12, 8, 26); }
  c.fillStyle = '#fff6c8'; for (const y of [h * .38, h * .3]) { c.fillRect(w * .5 - 5, y, 2, 9); c.fillRect(w * .5 + 3, y, 2, 9); }
}
function paintIcon(cv, fn) {
  const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  cv.width = w * d; cv.height = h * d; const c = cv.getContext('2d'); c.scale(d, d); fn(c, w, h);
}
function renderCards() {
  const box = $('cards'); box.innerHTML = '';
  const list = [...GAMES.map(g => ({ g })), { plane: true }];
  const jobs = [];
  for (const it of list) {
    const el = document.createElement(it.plane ? 'a' : 'button');
    el.className = 'card' + (it.g && it.g.feature ? ' feature' : '');
    const acc = it.plane ? '#ff5a36' : it.g.accent;
    el.style.setProperty('--acc', acc);
    const cvs = document.createElement('canvas'); el.appendChild(cvs);
    const body = document.createElement('div'); body.className = 'card-body';
    const h2 = document.createElement('h2'), p = document.createElement('p'), b = document.createElement('span');
    b.className = 'best';
    if (it.plane) {
      el.href = PLANE_URL; el.target = '_blank'; el.rel = 'noopener';
      h2.textContent = 'Небесный ас'; p.textContent = 'Воздушный бой над морем с боссами. Открывается отдельно.'; b.textContent = 'Открыть ↗';
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = 'ОТДЕЛЬНО'; el.appendChild(tag);
      jobs.push([cvs, planeIcon]);
    } else {
      h2.textContent = it.g.name; p.textContent = it.g.desc; b.textContent = it.g.bestText(getBest(it.g.id));
      el.onclick = () => openGame(it.g);
      jobs.push([cvs, (c, w, h) => it.g.icon(c, w, h)]);
    }
    body.append(h2, p, b); el.appendChild(body); box.appendChild(el);
  }
  requestAnimationFrame(() => jobs.forEach(([c, fn]) => paintIcon(c, fn)));
}

function boot() {
  renderCards();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!cur) renderCards(); });
  requestAnimationFrame(t => { last = t; frame(t); });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
